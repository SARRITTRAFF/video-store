<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Store</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
  color:#17202a
}
header{
  background:#111827;
  color:#fff;
  padding:16px
}
main{
  max-width:850px;
  margin:auto;
  padding:18px
}
.card{
  background:#fff;
  padding:18px;
  margin:14px 0;
  border-radius:12px;
  box-shadow:0 2px 8px #0001
}
input,textarea,button{
  width:100%;
  padding:11px;
  margin:6px 0;
  border:1px solid #ccd2d8;
  border-radius:8px;
  box-sizing:border-box
}
button{
  background:#111827;
  color:white;
  cursor:pointer
}
button:active{
  opacity:.7
}
.hidden{
  display:none
}
.video{
  border:1px solid #ddd;
  padding:14px;
  margin:10px 0;
  border-radius:9px
}
</style>
</head>

<body>

<header>
<b>My Video Store</b>
<button id="logout" class="hidden" onclick="logout()">Logout</button>
</header>

<main>

<div id="msg"></div>

<section id="auth" class="card">

<h2>Register / Login</h2>

<input id="name" placeholder="Name (registration)">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button type="button" onclick="register()">Register</button>

<button type="button" onclick="login()">Login</button>

</section>


<section id="app" class="hidden">

<div class="card">

<h2>Videos</h2>

<div id="videos">Loading...</div>

</div>


<div id="admin" class="card hidden">

<h2>Admin Portal</h2>

<h3>Upload video</h3>

<input id="title" placeholder="Title">

<textarea id="desc" placeholder="Description"></textarea>

<input id="price" type="number" value="10" min="0">

<input id="file" type="file" accept="video/*">

<button type="button" onclick="upload()">Upload</button>

<h3>Users database</h3>

<button type="button" onclick="users()">View users</button>

<div id="userlist"></div>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cbpcrvqisalojbaiywst.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable__HhCZzNesc04BJTgNrASwg_Qzwq5MVB";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let me = null;

const $ = id => document.getElementById(id);


function message(x){

$("msg").innerHTML =
'<div class="card">'+
String(x).replace(/[<>&]/g,c=>({
"<":"&lt;",
">":"&gt;",
"&":"&amp;"
}[c]))+
"</div>";

}


async function register(){

const email = $("email").value.trim();
const password = $("password").value;
const name = $("name").value.trim();

if(!email){
return message("Please enter your email.");
}

if(!password){
return message("Please enter a password.");
}

if(password.length < 6){
return message("Password must be at least 6 characters.");
}

message("Registering...");

try{

const result = await db.auth.signUp({

email:email,

password:password,

options:{
data:{
name:name
}
}

});

if(result.error){

return message(
"Registration error: "+
result.error.message
);

}

message(
"Registration successful. Check your email if confirmation is required."
);

}catch(error){

message(
"Connection error: "+
(error.message || error)
);

}

}


async function login(){

const email = $("email").value.trim();
const password = $("password").value;

if(!email || !password){

return message(
"Enter your email and password."
);

}

message("Logging in...");

try{

const result =
await db.auth.signInWithPassword({

email:email,
password:password

});

if(result.error){

return message(
"Login error: "+
result.error.message
);

}

me = result.data.user;

await start();

}catch(error){

message(
"Connection error: "+
(error.message || error)
);

}

}


async function start(){

$("auth").classList.add("hidden");

$("app").classList.remove("hidden");

$("logout").classList.remove("hidden");

const result =
await db
.from("profiles")
.select("role")
.eq("id",me.id)
.single();

if(result.error){

message(
"Login worked, but the profiles table could not be loaded: "+
result.error.message
);

return;

}

if(result.data.role === "admin"){

$("admin").classList.remove("hidden");

}

load();

}


async function load(){

const result =
await db
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(result.error){

return message(
"Videos error: "+
result.error.message
);

}

const data = result.data || [];

$("videos").innerHTML =
data.length
?
data.map(v=>`

<div class="video">

<h3>${esc(v.title)}</h3>

<p>${esc(v.description || "")}</p>

<b>KSh ${v.price}</b>

<button type="button"
onclick="buy(${v.id},${v.price})">
Buy / View
</button>

</div>

`).join("")
:
"No videos yet.";

}


function esc(x){

return String(x || "").replace(
/[<>&"]/g,
c=>({
"<":"&lt;",
">":"&gt;",
"&":"&amp;",
'"':"&quot;"
}[c])
);

}


async function buy(id,price){

if(!confirm(
"This video costs KSh "+price+". Continue?"
)) return;

const result =
await db
.from("purchases")
.insert({

user_id:me.id,
video_id:id,
amount:price

});

if(result.error){

return message(
"Purchase error: "+
result.error.message
);

}

const video =
await db
.from("videos")
.select("video_url")
.eq("id",id)
.single();

if(video.data && video.data.video_url){

location.href = video.data.video_url;

}

}


async function upload(){

const f = $("file").files[0];

const title = $("title").value.trim();

if(!f || !title){

return message(
"Enter a title and select a video."
);

}

const path =
crypto.randomUUID()+"-"+
f.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const uploadResult =
await db
.storage
.from("videos")
.upload(path,f);

if(uploadResult.error){

return message(
"Upload error: "+
uploadResult.error.message
);

}

const u =
db
.storage
.from("videos")
.getPublicUrl(path);

const r =
await db
.from("videos")
.insert({

title:title,

description:$("desc").value,

price:Number($("price").value || 10),

video_url:u.data.publicUrl,

storage_path:path

});

if(r.error){

return message(
"Database error: "+
r.error.message
);

}

message("Video uploaded successfully.");

load();

}


async function users(){

const result =
await db
.from("profiles")
.select("name,email,role,created_at")
.order("created_at",{ascending:false});

if(result.error){

return message(
"Users error: "+
result.error.message
);

}

$("userlist").innerHTML =
(result.data || []).map(u=>

'<div class="video">'+
esc(u.name || "")+
"<br>"+
esc(u.email || "")+
"<br>Role: "+
esc(u.role || "")+
"</div>"

).join("");

}


async function logout(){

await db.auth.signOut();

location.reload();

}


db.auth.getSession().then(async result=>{

if(result.data.session){

me = result.data.session.user;

await start();

}

});

</script>

</body>
</html>
